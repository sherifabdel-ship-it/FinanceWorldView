name: Smart Money / Dumb Money (COT) Dashboard + Telegram Alert

# CFTC publishes the COT report Fridays ~3:30pm US Eastern. Two UTC times cover
# both EDT and EST; telegram_alert.py de-duplicates so you get ONE message per week.
on:
  schedule:
    - cron: "40 19 * * 5"
    - cron: "40 20 * * 5"
  workflow_dispatch: {}

permissions:
  contents: write


jobs:
  run-cot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run COT dashboard script
        run: python cot_vs_price.py
      - name: Send Telegram alert
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python telegram_alert.py
      - uses: actions/upload-artifact@v4
        with:
          name: cot-dashboard
          path: docs/cot/
      - name: Commit and push (retries if another workflow pushed first)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/cot/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Automated update: refresh COT dashboard"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "Could not push after 5 attempts"; exit 1
