name: Seasonality Dashboard

on:
  schedule:
    - cron: "0 12 * * 1"   # Mondays 12:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write


jobs:
  run-seasonality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run seasonality dashboard script
        run: python seasonality_analysis.py
      - uses: actions/upload-artifact@v4
        with:
          name: seasonality-dashboard
          path: docs/seasonality/
      - name: Commit and push (retries if another workflow pushed first)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/seasonality/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Automated update: refresh seasonality dashboard"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "Could not push after 5 attempts"; exit 1
