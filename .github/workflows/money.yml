name: Where Money's At Dashboard

# Saturday, after Friday's COT release, so commodity positioning is fresh.
on:
  schedule:
    - cron: "30 14 * * 6"
  workflow_dispatch: {}

permissions:
  contents: write


jobs:
  run-money:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Build Where Money's At dashboard
        run: python wheres_money_at.py
      - uses: actions/upload-artifact@v4
        with:
          name: money-dashboard
          path: docs/money/
      - name: Commit and push (retries if another workflow pushed first)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/money/
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git commit -m "Automated update: refresh Where Money's At dashboard"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Push attempt $i failed, retrying..."; sleep $((i * 5))
          done
          echo "Could not push after 5 attempts"; exit 1
